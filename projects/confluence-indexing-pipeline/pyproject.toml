[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence-indexer"
version = "1.0.0"
description = "Incremental Confluence -> pgvector indexing pipeline orchestrated by Apache Airflow 3"
readme = "README.md"
requires-python = ">=3.11"
# Keep in step with requirements.txt, which MWAA installs directly.
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "langchain-text-splitters>=0.3,<2",
    "numpy>=1.26",
    "ollama>=0.4",
    "openai>=1.40",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# The orchestrator. Deployed environments (e.g. MWAA) provide it; install it
# locally to run `airflow standalone` against src/confluence_indexer.
airflow = ["apache-airflow>=3.1,<4"]
dev = [
    "moto[s3,sns,cloudwatch,secretsmanager]>=5",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
confluence_indexer = ["sql/queries/*.sql", "sql/schema_management/*.sql", ".airflowignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a live PostgreSQL with pgvector (set PGVECTOR_TEST_DSN)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101", # assert is fine in tests
    "S608", # SQL is built from constants, never from user input
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fixture credentials

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
